<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Load com JavaScript</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>

<body>
    <header>
        <h1 class="title">Passeio pelo Espaço</h1>
    </header>

    <main>
        <div class="container">

            <!-- Image 1 -->
            <div class="img-container">
                <img src="https://cdn.esahubble.org/archives/images/wallpaper2/heic1501a.jpg" alt="Pilares de Criação">
                <p>Pilares de Criação</p>
            </div>

            <!-- Image 2 -->
            <div class="img-container">
                <img src="https://cdn.esahubble.org/archives/images/wallpaper2/heic2007a.jpg"
                    alt="Tapeçaria do Nascimento Estelar Flamejante">
                <p>Tapeçaria do Nascimento Estelar Flamejante</p>
            </div>

            <!-- Image 3 -->
            <div class="img-container">
                <img src="https://cdn.esahubble.org/archives/images/wallpaper2/heic1509a.jpg" alt="Westerlund 2">
                <p>Westerlund 2</p>
            </div>

            <!-- Image 4 -->
            <div class="img-container">
                <img src="https://cdn.esahubble.org/archives/images/wallpaper2/potw2050a.jpg"
                    alt="Anéis da Relatividade">
                <p>Anéis da Relatividade</p>
            </div>

            <!-- Image 5 -->
            <div class="img-container">
                <img src="https://cdn.esahubble.org/archives/images/wallpaper2/heic2018b.jpg" alt="Galáxia NGC 2525">
                <p>Galáxia NGC 2525</p>
            </div>

            <!-- Image 6 -->
            <div class="img-container">
                <img src="https://cdn.esahubble.org/archives/images/wallpaper2/heic1608a.jpg" alt="A Nebulosa da Bolha">
                <p>A Nebulosa da Bolha</p>
            </div>
        </div>
    </main>


</body>

</html>
